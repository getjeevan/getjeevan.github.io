<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teleprompter Studio</title>
<meta name="description" content="A simple browser teleprompter with mirror mode, speed controls, and portable exports.">
<style>
:root{--paper:#f4efe3;--ink:#171717;--stage:#10100f;--cream:#fff8ea;--muted:#bbb2a3;--gold:#e6bc63}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#111;color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}button:hover{transform:translateY(-1px)}.shell{display:grid;min-height:100vh;grid-template-columns:390px minmax(0,1fr)}.sidebar{display:flex;min-height:100vh;flex-direction:column;border-right:1px solid rgba(255,255,255,.1);background:var(--paper);color:var(--ink);padding:20px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow,.control span{color:#645f55;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0 0;font-size:28px;line-height:1.05}.iconButton{width:40px;height:40px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:18px;font-weight:950}.control{display:flex;min-height:0;flex-direction:column;gap:8px}.control input,.control textarea{width:100%;border:1px solid #d8d0c0;border-radius:7px;background:#fffaf0;color:var(--ink);outline:none}.control input{height:44px;padding:0 12px;font-weight:800}.control textarea{min-height:280px;flex:1;resize:none;padding:14px;line-height:1.5}.control input:focus,.control textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,.1)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}.stat{display:flex;min-width:0;flex-direction:column;border:1px solid #ded5c5;border-radius:7px;background:#fffaf0;padding:10px 6px}.stat strong{font-size:22px;font-weight:950;line-height:1}.stat span{margin-top:4px;color:#736c60;font-size:11px;font-weight:800}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.primary,.secondary,.fileButton{display:inline-flex;min-height:44px;align-items:center;justify-content:center;border-radius:7px;padding:0 12px;font-size:14px;font-weight:900}.primary{border:1px solid var(--ink);background:var(--ink);color:#fff;box-shadow:0 12px 24px rgba(23,23,23,.16)}.secondary,.fileButton{border:1px solid #d8d0c0;background:#fffaf0;color:var(--ink)}.fileButton{margin-top:12px}.fileButton input{display:none}.stage{display:flex;min-height:100vh;flex-direction:column;background:var(--stage)}.controls{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr)) repeat(2,96px);gap:12px;border-bottom:1px solid rgba(255,255,255,.1);background:radial-gradient(circle at 10% 0%,rgba(231,199,136,.14),transparent 32%),#151514;padding:14px 18px}.range{display:flex;min-width:0;flex-direction:column;justify-content:center;gap:8px}.range span{display:flex;justify-content:space-between;gap:8px;color:#cfc5b5;font-size:12px;font-weight:900}.range b{color:#fff6e8}.range input,.toggle input{accent-color:var(--gold)}.toggle{display:inline-flex;min-width:0;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.06);color:#f8eedc;font-size:13px;font-weight:900}.meter{height:5px;background:#26231d}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f3e1ad)}.viewport{height:0;flex:1;overflow:auto}.script{min-height:100%;margin:0 auto;padding:24vh 24px 54vh;color:var(--cream);font-weight:850;letter-spacing:0;text-wrap:pretty;white-space:pre-wrap;text-shadow:0 4px 28px rgba(0,0,0,.42)}.script.mirrored{transform:scaleX(-1)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,.1);padding:12px 20px;color:var(--muted);font-size:14px}.tokenScreen{display:grid;min-height:100vh;place-items:center;padding:20px}.tokenCard{width:min(420px,100%);border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#f4efe3;color:var(--ink);padding:26px;box-shadow:0 28px 80px rgba(0,0,0,.36)}.error{color:#b84d24;font-size:14px;font-weight:800}.hidden{display:none!important}@media(max-width:1180px){.controls{grid-template-columns:repeat(3,minmax(140px,1fr))}}@media(max-width:1024px){.shell{grid-template-columns:1fr}.sidebar{min-height:0;border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}.control textarea{min-height:180px}.viewport{min-height:58vh}}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr;padding:12px}.script{padding-inline:18px}}
</style>
</head>
<body>
<main class="tokenScreen" id="token-screen"><form class="tokenCard" id="token-form"><p class="eyebrow">Prompt Studio</p><h1>Teleprompter</h1><label class="control" style="margin-top:28px"><span>Access token</span><input id="token-entry" placeholder="Enter token" autocomplete="current-password" autofocus></label><p class="error hidden" id="token-error">Token did not match.</p><button class="primary" style="width:100%;margin-top:20px" type="submit">Open teleprompter</button></form></main>
<main class="shell hidden" id="app"><aside class="sidebar"><div class="brand"><div><p class="eyebrow">Prompt Studio</p><h1>Teleprompter</h1></div><button class="iconButton" id="icon-play" aria-label="Play teleprompter" title="Play">&gt;</button></div><label class="control"><span>Title</span><input id="title" value="Launch update"></label><label class="control" style="flex:1;margin-top:12px"><span>Script</span><textarea id="editor"></textarea></label><div class="stats"><div class="stat"><strong id="words">0</strong><span>words</span></div><div class="stat"><strong id="mins">1</strong><span>min read</span></div><div class="stat"><strong id="done">0%</strong><span>done</span></div></div><div class="buttons"><button class="primary" id="play">Play</button><button class="secondary" id="reset">Reset</button></div><div class="buttons"><button class="secondary" id="export-html">Export HTML</button><button class="secondary" id="export-json">Export JSON</button></div><label class="fileButton">Import JSON<input type="file" id="import-json" accept="application/json,.json"></label></aside><section class="stage"><div class="controls"><label class="range"><span>Speed <b id="speed-label">34px/s</b></span><input id="speed" type="range" min="8" max="120" value="34"></label><label class="range"><span>Text <b id="font-label">54px</b></span><input id="font-size" type="range" min="28" max="96" value="54"></label><label class="range"><span>Lines <b id="line-label">1.35x</b></span><input id="line-height" type="range" min="1.1" max="1.8" step="0.05" value="1.35"></label><label class="range"><span>Width <b id="width-label">820px</b></span><input id="width" type="range" min="520" max="1200" value="820"></label><label class="toggle"><input id="mirror" type="checkbox"><span>Mirror</span></label><label class="toggle"><input id="uppercase" type="checkbox"><span>Caps</span></label></div><div class="meter"><span id="meter"></span></div><div class="viewport" id="viewport"><article class="script" id="script"></article></div><footer><span id="timer">0:00</span><span>Spacebar: play or pause</span></footer></section></main>
<script>
const ACCESS_TOKEN="prompt123";
const sampleScript=`Welcome back. Today we are filming a short product update.

Keep your shoulders relaxed, look just above the lens, and let the words move at a pace that feels natural.

This simple teleprompter keeps the controls nearby, lets you mirror the script for glass rigs, and exports a portable file you can open anywhere.`;
const $=id=>document.getElementById(id);const state={title:"Launch update",script:sampleScript,speed:34,fontSize:54,lineHeight:1.35,width:820,mirror:false,uppercase:false,running:false,elapsed:0,progress:0,start:null,raf:null};const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"teleprompter";
function unlock(token){if(token===ACCESS_TOKEN){localStorage.setItem("teleprompter-token",ACCESS_TOKEN);$("token-screen").classList.add("hidden");$("app").classList.remove("hidden");render();return true}return false}
$("token-form").addEventListener("submit",e=>{e.preventDefault();$("token-error").classList.toggle("hidden",unlock($("token-entry").value.trim()))});
function render(){const words=state.script.trim().split(/\s+/).filter(Boolean).length;$("title").value=state.title;$("editor").value=state.script;$("script").textContent=state.uppercase?state.script.toUpperCase():state.script;$("script").className="script"+(state.mirror?" mirrored":"");$("script").style.maxWidth=`${state.width}px`;$("script").style.fontSize=`${state.fontSize}px`;$("script").style.lineHeight=state.lineHeight;$("words").textContent=words;$("mins").textContent=Math.max(1,Math.round(words/150));$("done").textContent=`${state.progress}%`;$("meter").style.width=`${state.progress}%`;$("timer").textContent=`${Math.floor(state.elapsed/60)}:${String(Math.floor(state.elapsed%60)).padStart(2,"0")}`;$("play").textContent=state.running?"Pause":"Play";$("icon-play").textContent=state.running?"||":">";$("speed-label").textContent=`${state.speed}px/s`;$("font-label").textContent=`${state.fontSize}px`;$("line-label").textContent=`${state.lineHeight}x`;$("width-label").textContent=`${state.width}px`}
function tick(time){if(state.start===null)state.start=time;state.elapsed=(time-state.start)/1000;const maxScroll=Math.max(0,$("script").scrollHeight-$("viewport").clientHeight);$("viewport").scrollTop=clamp(state.elapsed*state.speed,0,maxScroll);state.progress=maxScroll?Math.round(($("viewport").scrollTop/maxScroll)*100):0;if($("viewport").scrollTop>=maxScroll&&maxScroll>0){state.running=false;render();return}render();state.raf=requestAnimationFrame(tick)}
function togglePlay(){state.running=!state.running;if(state.running){state.start=performance.now()-state.elapsed*1000;state.raf=requestAnimationFrame(tick)}else cancelAnimationFrame(state.raf);render()}function reset(){state.running=false;state.elapsed=0;state.progress=0;state.start=null;$("viewport").scrollTop=0;cancelAnimationFrame(state.raf);render()}function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=filename;link.click();URL.revokeObjectURL(url)}
$("title").addEventListener("input",e=>{state.title=e.target.value});$("editor").addEventListener("input",e=>{state.script=e.target.value;reset()});$("play").addEventListener("click",togglePlay);$("icon-play").addEventListener("click",togglePlay);$("reset").addEventListener("click",reset);$("speed").addEventListener("input",e=>{state.speed=Number(e.target.value);render()});$("font-size").addEventListener("input",e=>{state.fontSize=Number(e.target.value);render()});$("line-height").addEventListener("input",e=>{state.lineHeight=Number(e.target.value);render()});$("width").addEventListener("input",e=>{state.width=Number(e.target.value);render()});$("mirror").addEventListener("change",e=>{state.mirror=e.target.checked;render()});$("uppercase").addEventListener("change",e=>{state.uppercase=e.target.checked;render()});$("export-json").addEventListener("click",()=>download(`${slug(state.title)}.json`,JSON.stringify({title:state.title,script:state.script,speed:state.speed,fontSize:state.fontSize,lineHeight:state.lineHeight,width:state.width,mirror:state.mirror,uppercase:state.uppercase},null,2),"application/json"));$("export-html").addEventListener("click",()=>download(`${slug(state.title)}.html`,document.documentElement.outerHTML,"text/html"));$("import-json").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader;reader.onload=()=>{try{const incoming=JSON.parse(String(reader.result));state.title=incoming.title||"Imported script";state.script=incoming.script||"";state.speed=clamp(Number(incoming.speed)||34,8,120);state.fontSize=clamp(Number(incoming.fontSize)||54,28,96);state.lineHeight=clamp(Number(incoming.lineHeight)||1.35,1.1,1.8);state.width=clamp(Number(incoming.width)||820,520,1200);state.mirror=Boolean(incoming.mirror);state.uppercase=Boolean(incoming.uppercase);$("speed").value=state.speed;$("font-size").value=state.fontSize;$("line-height").value=state.lineHeight;$("width").value=state.width;$("mirror").checked=state.mirror;$("uppercase").checked=state.uppercase;reset()}catch{alert("That file does not look like a teleprompter project.")}};reader.readAsText(file);e.target.value=""});
window.addEventListener("keydown",e=>{const tag=e.target&&e.target.tagName;if(e.code==="Space"&&tag!=="TEXTAREA"&&tag!=="INPUT"){e.preventDefault();togglePlay()}});
unlock(new URLSearchParams(location.search).get("token")||localStorage.getItem("teleprompter-token")||"");
</script>
</body>
</html>
